<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3B9459">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="묵룡 한자 숲">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>묵룡 한자 숲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
/* Layout: one-column "forest path" app (max 720px), big touch targets, hanzi always sit on 田字格 practice paper */
:root{
  --bg:#EAF4E6; --surface:#FFFFFF; --surface2:#F4FAF1; --ink:#1E2A33; --muted:#5A6B66; --line:#D3E3CF;
  --leaf:#3B9459; --leaf-ink:#FFFFFF; --leaf-soft:#D6EED8; --sun:#FFC83D; --sun-ink:#3A2A00; --sun-soft:#FFF1C4;
  --sky:#3F9AD6; --sky-soft:#DCEFFB; --coral:#E65F4F; --coral-soft:#FDE1DC; --gold:#C98A12; --gold-soft:#FFF0C2;
  --warn:#B42318; --grid:#E3A99B; --shadow:rgba(30,60,40,.12); --press:rgba(0,0,0,.18);
  --f-display:'Jua','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Gowun Dodum',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-han:'Noto Serif KR','Batang','AppleMyungjo',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#122019; --surface:#1B2C23; --surface2:#20352A; --ink:#E8F2EA; --muted:#A2B6AA; --line:#2E4638;
  --leaf:#5CC07F; --leaf-ink:#0E1A13; --leaf-soft:#244634; --sun:#FFD25E; --sun-ink:#2E2200; --sun-soft:#3D3418;
  --sky:#6FC0F0; --sky-soft:#173446; --coral:#FF8B7D; --coral-soft:#4A2420; --gold:#F0BE4E; --gold-soft:#3F3415;
  --warn:#FF8B7D; --grid:#7A5249; --shadow:rgba(0,0,0,.35); --press:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#122019; --surface:#1B2C23; --surface2:#20352A; --ink:#E8F2EA; --muted:#A2B6AA; --line:#2E4638;
  --leaf:#5CC07F; --leaf-ink:#0E1A13; --leaf-soft:#244634; --sun:#FFD25E; --sun-ink:#2E2200; --sun-soft:#3D3418;
  --sky:#6FC0F0; --sky-soft:#173446; --coral:#FF8B7D; --coral-soft:#4A2420; --gold:#F0BE4E; --gold-soft:#3F3415;
  --warn:#FF8B7D; --grid:#7A5249; --shadow:rgba(0,0,0,.35); --press:rgba(0,0,0,.45); color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body.g-low{font-size:19px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-display);font-weight:400}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
.han{font-family:var(--f-han);font-weight:900}
.disp{font-family:var(--f-display);font-weight:400}
.muted{color:var(--muted)}
.h1{font-size:28px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 3px 0 var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;
  font-family:var(--f-display);font-size:20px;background:var(--leaf);color:var(--leaf-ink);box-shadow:0 4px 0 var(--press);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.big{min-height:64px;font-size:23px;width:100%}
.btn.sm{min-height:40px;font-size:16px;padding:0 14px;border-radius:12px}
.btn.danger{color:var(--coral)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.back{font-family:var(--f-display);font-size:18px;padding:8px 4px;color:var(--muted)}
.link{color:var(--sky);text-decoration:underline;font-size:15px}

.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);font-family:var(--f-display);font-size:17px;box-shadow:0 2px 0 var(--line)}
.chip svg{width:28px;height:28px}

/* paper with 田字格 dashed guide */
.paper{position:relative;border:3px solid var(--grid);border-radius:14px;
  background:
    repeating-linear-gradient(to bottom,var(--grid) 0 7px,transparent 7px 14px) center/2px 100% no-repeat,
    repeating-linear-gradient(to right,var(--grid) 0 7px,transparent 7px 14px) center/100% 2px no-repeat,
    var(--surface)}

/* brand */
.brand{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.logo{font-size:34px;line-height:1.1;color:var(--leaf)}
.logo .han{color:var(--ink);font-size:.9em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--surface);border-radius:22px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:8px;padding:12px}
.pmain{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px}
.pmain b{font-size:22px}
.pmain small{color:var(--muted);font-size:14px}
.pcard.add{align-items:center;justify-content:center;min-height:170px;font-family:var(--f-display);font-size:20px;color:var(--leaf);border:3px dashed var(--line);box-shadow:none;background:transparent}
.pcard.add .plus{font-size:40px;line-height:1}
.prow{display:flex;gap:6px;justify-content:center}
.confirm{background:var(--coral-soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.hello{display:flex;align-items:center;gap:14px}
.hello svg{width:96px;flex:none}

/* form */
.form{display:flex;flex-direction:column;gap:10px}
.lbl{font-family:var(--f-display);font-size:18px;margin-top:6px}
.inp{font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);width:100%}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.segb{min-height:48px;border-radius:12px;background:var(--surface2);border:2px solid var(--line);font-family:var(--f-display);font-size:16px}
.segb.on,.sw.on,.copt.on{border-color:var(--leaf);background:var(--leaf-soft)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:64px;height:64px;border-radius:16px;border:3px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.sw svg{width:52px;height:52px}
.copts{display:flex;flex-direction:column;gap:8px}
.copt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);text-align:left}
.copt b{font-family:var(--f-display);font-weight:400;font-size:19px}
.copt small{color:var(--muted)}
.copt.locked{opacity:.55;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sun-soft);color:var(--ink);margin-left:6px;vertical-align:2px}

/* home */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:14px;background:linear-gradient(180deg,var(--sky-soft),var(--surface) 70%)}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px;font-family:var(--f-display);font-size:19px;text-align:center;max-width:420px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.dragon.big{width:min(210px,58vw);height:auto}
.dragon.mini{width:88px;height:88px}
.dragon.tiny{width:28px;height:28px}
.dimg{display:inline-grid;place-items:end center;aspect-ratio:1;flex:none;position:relative;isolation:isolate}
.dimg:not(.big):not(.mini):not(.tiny){width:100%;height:100%}
.dimg img{width:100%;height:100%;object-fit:contain;transform:scale(var(--k));transform-origin:50% 92%;pointer-events:none;user-select:none;-webkit-user-drag:none}
.dimg.big img,.dimg.mini img{animation:bobK 3s ease-in-out infinite}
@keyframes bobK{50%{translate:0 -4px}}
.dimg.st4::before{content:"";position:absolute;inset:8% 8% 2%;border-radius:50%;background:radial-gradient(circle,var(--sun-soft),transparent 68%);z-index:-1}
.dimg.st4{filter:drop-shadow(0 0 10px rgba(255,200,61,.55))}
.chip .dimg,.hello .dimg{width:28px;height:28px}
.hello .dimg{width:96px;height:96px}
.sw .dimg{width:52px;height:52px}
.stage{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(320px,100%)}
.stage b{font-size:22px}
.xpbar,.pbar{width:100%;height:14px;border-radius:999px;background:var(--leaf-soft);overflow:hidden}
.xpbar i,.pbar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .6s}
.xpbar i{background:linear-gradient(90deg,var(--leaf),var(--sun))}
.preview{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--muted);font-size:15px;margin-top:-6px}
.preview .han{font-size:22px;color:var(--ink)}
.coursebar{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left}
.coursebar b{font-size:20px}
.coursebar .meta{display:flex;justify-content:space-between;width:100%;font-size:14px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--surface);border-radius:18px;padding:12px 16px;font-family:var(--f-display);font-size:18px;box-shadow:0 3px 0 var(--line);text-align:left}
.toggle small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted)}
.knob{flex:none;width:54px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s;box-shadow:0 1px 3px var(--shadow)}
.toggle.on .knob{background:var(--leaf)}
.toggle.on .knob::after{left:27px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile-n{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border-radius:20px;padding:16px;box-shadow:0 3px 0 var(--line);text-align:left;min-height:110px}
.tile-n .ic{font-size:32px;line-height:1}
.tile-n b{font-family:var(--f-display);font-weight:400;font-size:20px}
.tile-n small{color:var(--muted);font-size:14px;line-height:1.3}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.x{font-size:26px;width:44px;height:44px;border-radius:50%;background:var(--surface2)}

/* adventure */
.steps{display:flex;gap:6px;align-items:center;flex:1;justify-content:flex-end}
.stp{font-family:var(--f-display);font-size:14px;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--muted)}
.stp.on{background:var(--leaf);color:var(--leaf-ink)}
.stp.ok{background:var(--leaf-soft);color:var(--ink)}
.learn{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.step-t{font-family:var(--f-display);font-size:18px;color:var(--leaf);align-self:flex-start}
.reveal{width:min(240px,62vw);aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.reveal>*{grid-area:1/1}
.reveal .emo{font-size:min(110px,28vw);animation:emoOut 1.7s ease forwards}
.reveal .hz{font-size:min(170px,44vw);line-height:1;opacity:0;animation:hzIn .7s 1.2s ease forwards}
@keyframes emoOut{0%,55%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
@keyframes hzIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.hunum{display:flex;align-items:center;gap:12px;font-size:30px}
.hunum b{color:var(--leaf);font-weight:400}
.say{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:44px;height:44px;padding:0 10px;border-radius:999px;background:var(--sky-soft);font-size:20px}
.say.big{min-width:58px;height:58px;font-size:26px}
.story{max-width:52ch;font-size:1.02em}
.note{background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-size:15px;max-width:52ch}
.together-hint{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:6px 10px}
.trace{width:min(300px,78vw);aspect-ratio:1;max-width:100%;touch-action:none}
.trace .ghost{position:absolute;inset:0;display:grid;place-items:center;font-size:min(230px,60vw);line-height:1;color:var(--ink);opacity:.14;pointer-events:none;user-select:none}
.sorder{width:min(220px,58vw);aspect-ratio:1;max-width:100%}
.stroke{position:absolute;inset:6%;width:88%;height:88%}
.stroke .gh path{fill:var(--ink);fill-opacity:.13}
.stroke .sk{fill:none;stroke:var(--leaf);stroke-width:150;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1.3;stroke-dashoffset:1.15;opacity:0;animation:skDraw .7s linear both}
@keyframes skDraw{0%{stroke-dashoffset:1.15;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.stroke .sn circle{fill:var(--sun);stroke:var(--surface);stroke-width:6}
.stroke .sn text{font-family:var(--f-display),sans-serif;font-weight:700;fill:var(--sun-ink);text-anchor:middle}
.stroke.anim .sn{opacity:0;transform-box:fill-box;transform-origin:center;animation:snIn .35s ease-out both}
@keyframes snIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.trace .ghost.svg{opacity:1}
/* 따라 쓰기 칸: 기다리는 번호는 반투명, 다 쓴 번호는 숨기고, 지금 쓸 번호만 또렷하게 */
.trace .sn{transform-box:fill-box;transform-origin:center;transition:opacity .2s;opacity:.35}
.trace .sn.done{opacity:0}
.trace .ghost.top{z-index:1}
.trace .ghost.top .sn:not(.next),.trace .ghost:not(.top) .sn.next{visibility:hidden}
.trace .sn.next{opacity:1;transform:scale(1.5)}
.trace .sn.next circle{fill:var(--sun);stroke:var(--leaf);stroke-width:8}
.trace .sn.next{animation:snPulse 1.4s ease-in-out infinite}
.trace .sn.nudge{animation:snNudge .5s ease-out 2,snPulse 1.4s 1s ease-in-out infinite}
@keyframes snPulse{0%,100%{transform:scale(1.5)}50%{transform:scale(1.75)}}
@keyframes snNudge{0%,100%{transform:scale(1.5)}50%{transform:scale(2.2)}}
.tmsg{min-height:1.6em;font-family:var(--f-display);font-size:18px;line-height:1.4;color:var(--muted);max-width:30ch}
.tmsg.ok{color:var(--leaf)}
.tmsg.bad{color:var(--warn);background:var(--coral-soft);border-radius:12px;padding:6px 12px}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:11px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;width:100%}
.wcard{background:var(--surface2);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;border:2px solid var(--line)}
.wtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wcard.quiz{width:100%;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.wcard.quiz:active{transform:translateY(2px)}
.wcard.quiz:not(.s2) .wc small{visibility:hidden}
.wcard.quiz.s1{border-color:var(--sky)}
.wcard.quiz.s2{border-color:var(--leaf)}
.wcard.quiz.s2 .wread,.wcard.quiz.s2 .wmean{animation:up .25s ease-out}
.whint{font-family:var(--f-display);font-size:16px;color:var(--muted);padding:4px 0}
.wcard.quiz.s1 .whint{color:var(--sky)}
.rchip.s1{border-color:var(--sky)}
.rhint{font-size:14px}
.whan{display:flex;gap:4px;flex-wrap:wrap}
.wc{display:flex;flex-direction:column;align-items:center;min-width:48px;padding:4px 4px 2px;border-radius:10px;background:var(--surface)}
.wc b{font-family:var(--f-han);font-weight:900;font-size:30px;line-height:1.1}
.wc small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.wc.focus{background:var(--leaf-soft)}
.wread{font-size:22px}
.wmean{font-size:15px;color:var(--muted)}
.related{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:15px}
.rchip{display:inline-flex;gap:6px;align-items:baseline;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.rchip .han{font-size:18px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.qprompt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qbig{font-size:min(110px,26vw);line-height:1.1}
.qbig.l3{font-size:min(84px,20vw)}
.qbig.l4{font-size:min(66px,15vw)}
.qmid{font-family:var(--f-display);font-size:26px;line-height:1.3}
.qsub{color:var(--muted);font-size:16px}
.qsent{font-size:21px;line-height:1.6;max-width:36ch}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--leaf);color:var(--leaf);font-family:var(--f-display)}
.qemoji{font-size:min(110px,26vw);line-height:1.1}
.qear{font-size:64px}
.hint{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:15px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{min-height:64px;padding:10px;border-radius:16px;background:var(--surface2);border:2px solid var(--line);font-size:18px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 var(--line)}
.opt .han{font-size:34px;line-height:1.15}
.opt small{color:var(--muted);font-size:14px}
.opt .ko{font-family:var(--f-display);font-size:22px}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf);animation:pop .35s}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);animation:shake .4s}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
.fb{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;padding:10px;border-radius:14px}
.fb b{font-size:22px}
.fb.good{background:var(--leaf-soft)}
.fb.soft{background:var(--sun-soft)}
.fb small{color:var(--muted);font-size:14.5px}
.turn{align-self:center;font-family:var(--f-display);font-size:16px;padding:4px 14px;border-radius:999px;background:var(--sun-soft)}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s}

/* game picker */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:0 3px 0 var(--line);text-align:left;min-height:120px}

.fin-h{text-align:center;font-size:30px;color:var(--leaf)}

.cmp b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}

.gq{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}

let SVGN=0;const SK_DUR=.7,SK_GAP=.3;
function strokeSVG(c,anim){const d=STK[c];if(!d)return '';const id='sk'+(++SVGN);let defs='',ghost='',ink='',nums='';const placed=[];
  const R=d.s.length<=5?38:d.s.length<=9?33:29; // 획이 많은 글자일수록 번호를 작게
  d.s.forEach((s,i)=>{const m=d.m[i],pts=[];for(let k=0;k<m.length;k+=2)pts.push([m[k],m[k+1]]);const t=(i*(SK_DUR+SK_GAP)).toFixed(2);
    ghost+=`<path d="${s}"/>`;
    if(anim){defs+=`<clipPath id="${id}-${i}"><path d="${s}"/></clipPath>`;ink+=`<path class="sk" pathLength="1" clip-path="url(#${id}-${i})" d="M${pts.map(p=>p.join(' ')).join('L')}" style="animation-delay:${t}s"/>`;}
    // 번호는 획이 시작하는 점 둘레에 두고, 앞 번호와 겹치면 옆이나 더 뒤로 비켜 놓음
    const [x0,y0]=pts[0],[x1,y1]=pts[Math.min(1,pts.length-1)],len=Math.hypot(x1-x0,y1-y0)||1,ux=(x1-x0)/len,uy=(y1-y0)/len;
    const cands=[[-1.5,0],[-1.3,-1.8],[-1.3,1.8],[-3.2,0],[-2.8,-2.4],[-2.8,2.4],[0,-2.4],[0,2.4],[-4.6,0]].map(([a,b])=>[a*R,b*R]).map(([a,b])=>{
      const px=x0+ux*a-uy*b,py=900-(y0+uy*a+ux*b);return[Math.min(980,Math.max(44,px)),Math.min(980,Math.max(44,py))];});
    const [nx,ny]=cands.find(([px,py])=>placed.every(([qx,qy])=>Math.hypot(px-qx,py-qy)>=R*2+8))||cands[0];placed.push([nx,ny]);
    nums+=`<g class="sn" ${anim?`style="animation-delay:${t}s"`:''}><circle cx="${nx.toFixed(0)}" cy="${ny.toFixed(0)}" r="${R}"/><text x="${nx.toFixed(0)}" y="${(ny+R*.42).toFixed(0)}" font-size="${(R*1.2).toFixed(0)}">${i+1}</text></g>`;});
  if(anim==='nums')return `<svg class="stroke" viewBox="0 0 1024 1024" aria-hidden="true">${nums}</svg>`;
  return `<svg class="stroke ${anim?'anim':''}" viewBox="0 0 1024 1024" role="img" aria-label="${c} 획순, 모두 ${d.s.length}획"><defs>${defs}</defs><g transform="translate(0 900) scale(1 -1)"><g class="gh">${ghost}</g>${ink}</g>${nums}</svg>`;}

const TTS={ok:typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined',v:null,n:0,unlocked:false,cur:null,warned:false};
function pickVoice(){try{const vs=speechSynthesis.getVoices();TTS.n=vs.length;TTS.v=vs.find(v=>/^ko[-_]?KR/i.test(v.lang))||vs.find(v=>/^ko/i.test(v.lang))||null;}catch(e){}}
if(TTS.ok){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e2){}}}
// 아이패드·안드로이드 태블릿은 화면을 처음 누를 때 음성을 깨워 두어야, 그 뒤 자동으로 읽어 주는 소리도 남
function unlockTTS(){if(!TTS.ok||TTS.unlocked)return;TTS.unlocked=true;
  try{pickVoice();const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.lang='ko-KR';speechSynthesis.speak(u);}catch(e){}}
if(TTS.ok)['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockTTS,{capture:true,passive:true}));
/* 녹음된 소리: audio/*.mp3 (묶음별 한 파일) + audio/index.json(문장 → [묶음, 시작초, 길이초])
   기기마다 다른 음성 합성(TTS) 대신 미리 녹음한 소리를 Web Audio로 틀고, 녹음에 없는 문장만 TTS로 읽음 */
const AUD={ctx:null,idx:null,buf:{},loading:{},src:null,req:0};
const CAN_SAY=TTS.ok||!!(window.AudioContext||window.webkitAudioContext); // 소리로 묻는 문제를 낼 수 있는지
fetch('audio/index.json').then(r=>r.ok?r.json():null).then(j=>{if(j)AUD.idx=j;}).catch(()=>{});
function audCtx(){if(!AUD.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AUD.ctx=new C();}catch(e){return null;}}return AUD.ctx;}
function audLoad(g){if(AUD.buf[g])return Promise.resolve(AUD.buf[g]);if(AUD.loading[g])return AUD.loading[g];const ctx=audCtx();if(!ctx)return Promise.resolve(null);
  AUD.loading[g]=fetch('audio/'+g+'.mp3').then(r=>r.arrayBuffer()).then(ab=>new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej))).then(b=>{AUD.buf[g]=b;return b;}).catch(()=>{delete AUD.loading[g];return null;});
  return AUD.loading[g];}
function audStop(){if(AUD.src){try{AUD.src.stop();}catch(e){}AUD.src=null;}}
function audPlay(e,t){const ctx=audCtx(),my=++AUD.req;if(ctx.state!=='running')ctx.resume().catch(()=>{});
  audLoad(e[0]).then(b=>{if(my!==AUD.req)return;if(!b){ttsSpeak(t);return;}audStop();const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0,e[1],e[2]);AUD.src=s;});}
// 처음 화면을 누를 때 소리 장치를 깨우고(아이패드는 무음 스위치도 무시하도록), 자주 쓰는 소리를 미리 받아 둠
function unlockAudio(){const ctx=audCtx();if(!ctx||AUD.unlocked)return;AUD.unlocked=true;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  try{ctx.resume();const s=ctx.createBufferSource();s.buffer=ctx.createBuffer(1,1,22050);s.connect(ctx.destination);s.start(0);}catch(e){}
  ['han','words','misc','sents'].forEach(audLoad);}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
function speak(t){if(!t)return;const e=AUD.idx&&AUD.idx[t];
  if(e&&audCtx()){try{if(TTS.ok)speechSynthesis.cancel();}catch(_){}audPlay(e,t);return;}
  ttsSpeak(t);}
function ttsSpeak(t){if(!TTS.ok||!t)return;
  try{if(!TTS.v)pickVoice();
    const go=()=>{try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.85;u.pitch=1.1;u.volume=1;if(TTS.v)u.voice=TTS.v;
      TTS.cur=u;// 크롬은 참조가 없으면 읽는 도중 끊기기도 함
      u.onerror=e=>{if(e&&(e.error==='language-unavailable'||e.error==='voice-unavailable'||e.error==='synthesis-failed'))warnVoice();};
      if(speechSynthesis.paused)speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}};
    // 읽는 중에 바로 cancel→speak 하면 태블릿 브라우저가 새 소리를 버리는 경우가 있어 잠깐 쉬고 읽음
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,120);}else go();
    if(TTS.n&&!TTS.v)warnVoice();
  }catch(e){}}
function warnVoice(){if(TTS.warned)return;TTS.warned=true;setTimeout(()=>toast('🔇 이 기기에서 한국어 음성을 찾지 못했어요. 기기 설정의 "텍스트 음성 변환"에서 한국어를 내려받아 주세요.'),300);}

const keyItem=k=>k[0]==='h'?{t:'h',c:k.slice(2)}:{t:'w',w:k.slice(2)};
const itemLabel=it=>it.t==='h'?it.c:it.w;
const itemSay=it=>it.t==='h'?hs(it.c):(WM[it.w]?WM[it.w].r:'');
function freePool(p){return[...Object.keys(p.learned).map(c=>({t:'h',c})),...Object.keys(p.seen).filter(w=>WM[w]).map(w=>({t:'w',w}))];}
function poolFrom(p,chars){
  let items=[...chars.map(c=>({t:'h',c})),...WORDS.filter(o=>chars.includes(o.h)&&p.seen[o.w]).map(o=>({t:'w',w:o.w}))];
  if(items.length<12){const have=new Set(items.map(itemKey));items=items.concat(sample(freePool(p).filter(it=>!have.has(itemKey(it))),12-items.length));}
  return items;}

function dragon(stage,c,cls){
  cls=cls||'';
  if(stage===0)return `<svg class="dragon ${cls}" viewBox="0 0 200 200" role="img" aria-label="묵룡 알"><ellipse cx="100" cy="184" rx="48" ry="7" fill="var(--shadow)"/><g class="wob"><path d="M100 30C140 30 160 95 160 125C160 160 133 180 100 180C67 180 40 160 40 125C40 95 60 30 100 30Z" fill="#FFF7E2" stroke="${c.d}" stroke-width="5"/><circle cx="78" cy="100" r="11" fill="${c.m}"/><circle cx="123" cy="80" r="7" fill="${c.m}"/><circle cx="118" cy="138" r="14" fill="${c.m}"/><circle cx="70" cy="146" r="6" fill="${c.m}"/><path d="M68 64l10 8 8-10 10 9" fill="none" stroke="${c.d}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
  // 깨어난 뒤에는 메인 캐릭터 그림(character/mukryong.png)을 쓰고, 단계가 오를수록 커지며 마지막 단계는 금빛으로 빛남
  // 프로필 색은 초록 그림의 색상을 돌려서 맞춤
  const s=stage,k=[0,.78,.86,.94,1][s],hue={green:0,sky:62,pink:-155,purple:110,orange:-105}[c.id]||0;
  return `<span class="dragon dimg st${s} ${cls}" role="img" aria-label="${STAGES[s].n}"><img src="character/mukryong.png" alt="" draggable="false" style="--k:${k};${hue?`filter:hue-rotate(${hue}deg)`:''}"></span>`;
}

function distractH(c,n){const p=cur(),cand=H_RAW.filter(h=>h.c!==c);const lr=cand.filter(h=>p&&p.learned[h.c]);
  let res=sample(lr,Math.min(n,lr.length));if(res.length<n)res=res.concat(sample(cand.filter(h=>!res.includes(h)),n-res.length));return res;}
function distractW(o,n,pool){const base=(pool||[...WORDS,...INFW]).filter(x=>x.w!==o.w&&x.r!==o.r&&x.m!==o.m);
  const share=base.filter(x=>[...x.w].some(ch=>o.w.includes(ch)));let res=sample(share,Math.min(2,share.length));
  res=res.concat(sample(base.filter(x=>!res.includes(x)),n-res.length));return res;}
function makeQ(item,kind){
  if(item.t==='h'){const h=HM[item.c],key='h:'+h.c,all=shuffle([h,...distractH(h.c,3)]);
    const base={key,answerText:h.c+' '+hs(h.c),afterSay:hs(h.c),explain:h.o};
    if(kind==='h2m')return{...base,prompt:`<div class="qbig han">${h.c}</div><div class="qsub">이 한자의 뜻과 음은?</div>`,opts:all.map(x=>({html:`<span class="ko">${hs(x.c)}</span>`,ok:x===h}))};
    const hopts=all.map(x=>({html:`<span class="han">${x.c}</span>`,ok:x===h}));
    if(kind==='m2h')return{...base,prompt:`<div class="qmid">'${hs(h.c)}'</div><div class="qsub">알맞은 한자를 골라요</div>`,opts:hopts};
    if(kind==='pic')return{...base,prompt:`<div class="qemoji">${h.e}</div><div class="qsub">그림에 어울리는 한자는?</div>`,opts:hopts};
    return{...base,prompt:`<div class="qear">👂</div><div class="qsub">잘 듣고 알맞은 한자를 골라요</div>${CAN_SAY?'':`<div class="qmid">${hs(h.c)}</div>`}`,say:hs(h.c),autoSay:true,opts:hopts,afterSay:null};
  }
  const o=WM[item.w]||INFW.find(x=>x.w===item.w),key='w:'+o.w,all=shuffle([o,...distractW(o,3)]);
  const base={key,answerText:o.w+' ('+o.r+')',afterSay:o.r,explain:brk(o.w)+' → '+o.m};
  const wopts=all.map(x=>({html:`<span class="han">${x.w}</span>`,ok:x===o}));
  if(kind==='w2m')return{...base,answerText:o.m,prompt:`<div class="qbig han ${lenCls(o.w)}">${o.w}</div><div class="qsub">이 낱말의 뜻은?</div>`,opts:all.map(x=>({html:`<span>${x.m}</span>`,ok:x===o}))};
  if(kind==='m2w')return{...base,prompt:`<div class="qmid">${o.m}</div><div class="qsub">이 뜻을 가진 낱말은?</div>`,opts:wopts};
  // 한글 읽기(sub)는 답을 고른 뒤에만 보여 줌: 한글이 아니라 한자를 보고 고르게
  if(kind==='pic')return{...base,prompt:`<div class="qemoji">${o.e}</div><div class="qsub">그림에 어울리는 낱말은?</div>`,opts:all.map(x=>({html:`<span class="han">${x.w}</span>`,sub:x.r,ok:x===o}))};
  if(kind==='sent'&&o.s)return{...base,prompt:`<div class="qsent">${o.s.replace('___','<span class="blank">?</span>')}</div><div class="qsub">빈칸에 알맞은 낱말은?</div>`,opts:all.map(x=>({html:`<span class="han">${x.w}</span>`,sub:x.r,ok:x===o})),afterSay:o.s.replace('___',o.r)};
  return{...base,prompt:`<div class="qear">👂</div><div class="qsub">잘 듣고 알맞은 낱말을 골라요</div>${CAN_SAY?'':`<div class="qmid">${o.r}</div>`}`,say:o.r,autoSay:true,opts:wopts,afterSay:null};
}
function randKind(it){const k=it.t==='h'?['h2m','m2h','pic']:['w2m','m2w','sent'];if(CAN_SAY)k.push('listen');return pick(k);}

      ${STK[h.c]?`<p class="tmsg" id="tmsg" aria-live="polite">노란 1번 동그라미에서 시작해요.</p>`:''}
      <div class="row" style="justify-content:center"><button class="btn ghost sm" data-act="clearCv">지우기</button><button class="btn ghost sm" data-act="say" data-t="${esc(hsx)}">🔊 ${hsx}</button></div></div>
      <button class="btn big" id="writeDone" data-act="lnext" ${STK[h.c]?'disabled':''}>${STK[h.c]?'✏️ 끝까지 쓰면 넘어갈 수 있어요':'다 썼어요 ✓'}</button>`;
    else if(ad.page===2)body=`${head}<div class="card learn"><div class="step-t">③ 낱말 넓히기 · <span class="han">${h.c}</span> 씨앗에서 열린 열매</div><p class="muted"><span class="han">${h.c}</span>(${hsx}) 글자가 들어간 낱말이에요. 카드를 누르면 소리가 나와요. 따라 읽고 한 번 더 누르면 한글이 보여요.</p>${th}
      <div class="words">${shown.map(o=>wordCardQuiz(o,h.c)).join('')}</div>
      ${rest.length&&!S.more?`<button class="btn ghost sm" data-act="more">낱말 더 보기 (${rest.length})</button>`:''}
      ${RELATED[h.c].length?`<div class="related"><span class="muted">다른 글자의 낱말에도 '${h.c}'가 들어 있어요:</span>${RELATED[h.c].slice(0,6).map(o=>{const st=wordStep(o.w);return `<button class="rchip s${st}" data-act="wtap" data-w="${esc(o.w)}"><span class="han">${o.w}</span>${st<2?`<span class="rhint">${st?'👆':'🔊'}</span>`:o.r}</button>`;}).join('')}</div>`:''}</div>
      <button class="btn big" data-act="lnext">문장 속에서 찾아볼래요 →</button>`;
    else body=`${head}<div class="step-t">④ 문장 속 낱말 (${ad.si+1}/${ad.sq.length})</div>${quizHTML()}`;
  }
  else if(ad.phase==='game'){body=`<h2 style="font-size:24px">🎲 얼마나 알게 됐는지 게임으로 확인해요</h2><p class="muted">하고 싶은 놀이를 하나 골라요.</p>
    <div class="ggrid">${GAMES.map(g=>`<button class="gcard" data-act="startGame" data-id="${g.id}" data-adv="1"><span class="ic">${g.i}</span><b>${g.n}</b><small>${g.d}</small>${p.games[g.id]?`<span class="cnt">${p.games[g.id]}번 했어요</span>`:''}</button>`).join('')}</div>`;}
  else if(ad.phase==='infer'){body=`<h2 style="font-size:22px">🔎 보너스 · 뜻 추리 <small class="muted">${ad.ii+1}/${ad.infQ.length}</small></h2><p class="muted">처음 보는 낱말이에요! 아는 글자로 뜻을 짐작해 봐요.</p>${quizHTML()}`;}
  else if(ad.phase==='finish'){body=finishHTML();}
  return `<div class="wrap"><div class="topbar"><button class="back" data-act="toHome">← 그만하기</button>${advSteps()}</div>${body}</div>`;};
function finishHTML(){const p=cur(),ad=S.adv,st=ad.endStage,grew=st>ad.startStage;
  return `<div class="confetti" aria-hidden="true">${Array.from({length:36},(_,i)=>`<i style="left:${(i*97)%100}%;background:${['#FFC83D','#5DBB7A','#5AAEE6','#F28DB2','#FF7A6B'][i%5]};animation-delay:${(i%12)*.08}s"></i>`).join('')}</div>
  <h2 class="fin-h">오늘의 모험 완료!</h2>
  ${grew?`<div class="grow">🎉 묵룡이 <b>${STAGES[st].n}</b>(으)로 자랐어요!</div>`:''}
  <div class="card hero" style="background:var(--surface)">${dragon(st,col(p),'big')}<div class="bubble">${grew?'고마워! 네 덕분에 이만큼 컸어!':'오늘도 함께해 줘서 고마워!'}</div></div>
  ${ad.learned.length?`<div class="card"><p class="lesson-h">새로 심은 한자 씨앗</p><div class="newh">${ad.learned.map(c=>`<span class="paper han">${c}</span>`).join('')}</div></div>`:''}
  <div class="stats">
    <div class="stat"><small>받은 점수</small><b>+${ad.xp}</b></div>

    ${ad.rev.length?`<div class="stat"><small>복습 정답</small><b>${ad.revOk}/${ad.rev.length}</b></div>`:''}
    <div class="stat"><small>만난 낱말 (모두)</small><b>${nS(p)}개</b></div>
  </div>
  ${ad.newBadges&&ad.newBadges.length?`<div class="card"><p class="lesson-h">새로 받은 배지</p><div class="bdgrid">${ad.newBadges.map(b=>`<div class="bd"><span class="ic">${b.i}</span><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div></div>`:''}

/* ---- 놀이터 / 게임 ---- */
V.games=()=>{const p=cur(),pool=freePool(p),ok=pool.length>=6,canInf=nL(p)>0&&inferCands(p,1).length>0;
  const infCard=`<button class="gcard infcard" data-act="startGame" data-id="infer" ${canInf?'':'disabled'} style="${canInf?'':'opacity:.5'}"><span class="ic">${INFER_GAME.i}</span><b>${INFER_GAME.n}</b><small>${INFER_GAME.d}</small><span class="cnt">${p.infer.n?'지금까지 '+p.infer.n+'문제 · 정답률 '+Math.round(p.infer.ok/p.infer.n*100)+'%':'문해력 연습 놀이예요'}</span></button>`;
  return `<div class="wrap"><div class="topbar"><button class="back" data-act="toHome">← 홈</button></div>
  <h1 class="h1">🎲 놀이터</h1><p class="muted">${ok?`지금까지 배운 한자 ${nL(p)}자와 낱말 ${nS(p)}개로 놀아요. 틀린 문제는 복습 상자로 돌아가요.`:'먼저 오늘의 모험에서 한자를 배우면 놀이터가 열려요!'}</p>
  ${infCard}
  <div class="ggrid">${GAMES.map(g=>`<button class="gcard" data-act="startGame" data-id="${g.id}" ${ok?'':'disabled'} style="${ok?'':'opacity:.5'}"><span class="ic">${g.i}</span><b>${g.n}</b><small>${g.d}</small>${p.games[g.id]?`<span class="cnt">${p.games[g.id]}번 했어요</span>`:''}</button>`).join('')}</div></div>`;};

function startGame(id,fromAdv){const p=cur();const pool=fromAdv?poolFrom(p,S.adv.learned.length?S.adv.learned:Object.keys(p.learned).slice(-6)):freePool(p);
  S.turn=0;const g={type:id,fromAdv,pool,done:false,correct:0,total:0};S.g=g;
  if(id==='memory'){const hz=shuffle(pool.filter(i=>i.t==='h')),ws=shuffle(pool.filter(i=>i.t==='w'));let chosen=[...hz.slice(0,3),...ws.slice(0,3)];
    if(chosen.length<6)chosen=chosen.concat(shuffle(pool.filter(i=>!chosen.includes(i))).slice(0,6-chosen.length));
    const cards=[];chosen.forEach((it,i)=>{cards.push({pair:i,k:'h',html:itemLabel(it),label:itemLabel(it),say:itemSay(it)});cards.push({pair:i,k:'k',html:it.t==='h'?hs(it.c):WM[it.w].r,label:it.t==='h'?hs(it.c):WM[it.w].r,say:itemSay(it)});});
    g.cards=shuffle(cards);g.open=[];g.moves=0;g.matched=0;g.pairs=chosen.length;g.lock=false;}
  else if(id==='bingo'){let cells=shuffle(pool.filter(i=>i.t==='w')).slice(0,6);cells=cells.concat(shuffle(pool.filter(i=>i.t==='h')).slice(0,9-cells.length));
    if(cells.length<9)cells=cells.concat(shuffle(pool.filter(i=>!cells.includes(i))).slice(0,9-cells.length));
    g.cells=shuffle(cells);g.st=g.cells.map(()=>false);g.order=shuffle(g.cells.map((_,i)=>i));g.ci=0;g.showText=!CAN_SAY;g.lines=0;g.total=g.cells.length;setTimeout(()=>bingoSay(),500);}
  else if(id==='assemble'){g.rounds=shuffle(pool.filter(i=>i.t==='w')).slice(0,5).map(i=>WM[i.w]);g.ri=0;g.total=g.rounds.length;if(!g.rounds.length){g.type='dictation';return startGame('dictation',fromAdv);}asmRound();}
  else if(id==='board'){g.pos=0;g.len=20;g.die=null;g.rolling=false;g.q=false;g.items=shuffle(pool);g.qi=0;g.msg='주사위를 굴려서 묵룡 둥지 🪺까지 가요!';}
  else if(id==='infer'){const cs=inferCands(p,5);if(!cs.length){toast('지금은 낼 수 있는 뜻 추리 문제가 없어요. 한자를 더 배워 봐요!');return;}
    g.qs=cs.map(makeInferQ);g.qi=0;g.total=g.qs.length;setQ(g.qs[0],ctxInferGame());}
  else{const kind=id==='detective'?'pic':'listen';let items=id==='detective'?pool.filter(i=>i.t==='h'||(WM[i.w]&&WM[i.w].e)):pool;
    g.qs=shuffle(items).slice(0,6).map(it=>makeQ(it,kind));g.qi=0;g.total=g.qs.length;setQ(g.qs[0],ctxQuizGame());}
  go('game');}
function ctxQuizGame(){return{onAnswer(ok){const g=S.g;if(ok)g.correct++;else srsAnswer(cur(),S.q.key,false);save();},onNext(){const g=S.g;g.qi++;S.turn++;if(g.qi<g.qs.length){setQ(g.qs[g.qi],ctxQuizGame());render();}else endGame();}};}
function bingoSay(){const g=S.g;if(!g||g.type!=='bingo'||g.done)return;speak(itemSay(g.cells[g.order[g.ci]]));}
function bingoLines(st){const L3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return L3.filter(l=>l.every(i=>st[i])).length;}
function asmRound(){const g=S.g,o=g.rounds[g.ri];if(!o)return;const chars=[...o.w];const pool8=H_RAW.map(h=>h.c).filter(c=>!chars.includes(c));
  g.tray=shuffle([...chars,...sample(pool8,Math.max(3,6-chars.length))]).map(c=>({c,used:false}));g.slots=[];g.rdone=false;g.wrongThis=false;}
function endGame(){const g=S.g,p=cur();if(g.done)return;g.done=true;const xp=5+Math.min(g.correct,10);g.xp=xp;p.xp+=xp;p.games[g.type]=(p.games[g.type]||0)+1;L(p).games++;
  if(g.fromAdv){S.adv.xp+=xp;S.adv.gamePlayed=true;}else checkBadges(p);save();speak(pick(['참 잘했어요!','멋지게 해냈어요!','최고예요!']));render();}
const INFER_GAME={id:'infer',i:'🔎',n:'뜻 추리 탐정',d:'처음 보는 낱말 5개의 뜻을 아는 글자로 짐작해요'};
V.game=()=>{const g=S.g,meta=GAMES.find(x=>x.id===g.type)||INFER_GAME;let body='';
  if(g.done){const ratio=g.total?g.correct/g.total:1;let stars=ratio>=.9?3:ratio>=.6?2:1;if(g.type==='memory')stars=g.moves<=g.pairs+3?3:g.moves<=g.pairs*2+2?2:1;
    const detail=g.type==='memory'?`${g.moves}번 뒤집어서 짝을 모두 찾았어요.`:g.type==='board'?`문제 ${g.total}개 가운데 ${g.correct}개를 맞히고 둥지에 도착했어요!`:`${g.total}개 가운데 ${g.correct}개를 맞혔어요.`;
    body=`<div class="card result"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h2 style="font-size:26px">${pick(['참 잘했어요!','멋지게 해냈어요!','한자 박사가 되어 가요!'])}</h2><p>${detail}</p><p class="xp">+${g.xp}점</p>${g.total&&g.correct<g.total?'<p class="muted" style="font-size:14px">틀린 글자는 복습 상자에 넣어 두었어요. 다음에 다시 만나요!</p>':''}</div>
    ${g.fromAdv?`<button class="btn big" data-act="afterGame">마무리하러 가기 →</button><button class="btn ghost" data-act="advGames">다른 게임도 할래요</button>`:`<button class="btn big" data-act="startGame" data-id="${g.type}">한 판 더!</button><button class="btn ghost" data-act="toGames">다른 게임 고르기</button>`}`;}
  else if(g.type==='memory'){body=`${turnHTML()}<p class="muted">한자와 뜻·소리가 짝꿍이에요. 같은 짝을 찾아 뒤집어요!</p>
    <div class="mgrid">${g.cards.map((c,i)=>`<button class="mcard" data-act="mflip" data-i="${i}" aria-label="카드 ${i+1}"><span class="back" aria-hidden="true">🐲</span><span class="front ${c.k}">${c.html}</span></button>`).join('')}</div>
    <p class="muted" style="text-align:center">뒤집은 횟수 <b id="mmoves">${g.moves}</b></p>`;}
  else if(g.type==='bingo'){const t=g.cells[g.order[g.ci]];
    body=`${turnHTML()}<div class="card callcard"><button class="say big" data-act="bsay" aria-label="다시 듣기">🔊</button><div><b class="disp" style="font-size:20px">잘 듣고 빙고판에서 찾아요 (${g.ci+1}/9)</b><br>${g.showText?`<span class="calltext">"${itemSay(t)}"</span>`:`<button class="link" data-act="bshow">글자로 보기</button>`}</div></div>
    <div class="bgrid">${g.cells.map((it,i)=>`<button class="bcell ${g.st[i]?'st':''} ${g.shake===i?'shake':''}" data-act="bpick" data-i="${i}"><span class="han ${lenCls(itemLabel(it))}">${itemLabel(it)}</span>${g.st[i]?'<i class="stamp">🐾</i>':''}</button>`).join('')}</div>
    <p class="bmsg">빙고 ${g.lines}줄!</p>`;}
  else if(g.type==='assemble'){const o=g.rounds[g.ri];// 조각 아래 뜻·음은 처음엔 숨기고, 제자리에 놓았거나 잘못 고른 조각에만 보여 줌
    body=`${turnHTML()}<div class="card asm"><div class="qsub">${g.ri+1}/${g.rounds.length} · 글자 조각을 차례대로 눌러 낱말을 만들어요</div><div class="ameaning">${o.m}</div>
      <div class="aread"><span class="disp">${o.r}</span><button class="say" data-act="say" data-t="${esc(o.r)}" aria-label="듣기">🔊</button></div>
      <div class="slots">${[...o.w].map((c,i)=>`<span class="slot paper">${g.slots[i]?`<b class="han">${g.slots[i]}</b><small>${hs(g.slots[i])}</small>`:''}</span>`).join('')}</div>
      ${g.rdone?`<div class="fb good"><b class="disp">${pick(PRAISE)}</b><small>${brk(o.w)}</small></div><button class="btn big" data-act="anext">다음 →</button>`
      :`<div class="tray">${g.tray.map((t,k)=>`<button class="ttile ${t.used?'used':''} ${g.shake===k?'shake':''}" data-act="apick" data-k="${k}" ${t.used?'disabled':''}><b class="han">${t.c}</b>${t.tried?`<small>${hs(t.c)}</small>`:''}</button>`).join('')}</div>`}</div>`;}
  else if(g.type==='board'){const p=cur();
    const tiles=Array.from({length:g.len},(_,i)=>{const r=Math.floor(i/5),cIdx=r%2?4-i%5:i%5;const star=i%5===4&&i<g.len-1,end=i===g.len-1,start=i===0;
      return `<div class="btile ${star?'star':''} ${end?'end':''} ${start?'start':''}" style="grid-row:${r+1};grid-column:${cIdx+1}">${start?'출발':end?'🪺':star?'⭐':i+1}${g.pos===i?`<span class="tok">${dragon(Math.max(1,stageOf(p.xp)),col(p))}</span>`:''}</div>`;}).join('');
    body=`${turnHTML()}<div class="board">${tiles}</div><p class="bmsg">${g.msg||''}</p>
    ${g.q?quizHTML():`<div class="bctl"><div class="die ${g.rolling?'roll':''}" aria-live="polite">${'⚀⚁⚂⚃⚄⚅'[(g.die||1)-1]}</div><button class="btn big" data-act="roll" ${g.rolling?'disabled':''}>주사위 굴리기</button><p class="muted" style="font-size:14px">⭐ 칸에 서면 한 칸 더! 문제를 맞히면 또 한 칸 더!</p></div>`}`;}
  else{body=`<p class="muted">${g.qi+1}/${g.qs.length}</p>${quizHTML()}`;}
  return `<div class="wrap"><div class="topbar"><button class="back" data-act="${g.fromAdv?'advGames':'toGames'}">← ${g.fromAdv?'게임 고르기':'놀이터'}</button><span class="chip">${meta.i} ${meta.n}</span></div>${body}</div>`;};

  const tile=ch=>{if(!p.learned[ch])return `<div class="ftile seed" title="아직 만나지 않은 한자">🌰</div>`;const e=p.srs['h:'+ch];return `<button class="ftile ${e&&e.b===6?'gold':''}" data-act="detail" data-c="${ch}"><span class="han">${ch}</span><small>${hs(ch)}</small></button>`;};

  <p class="muted" style="font-size:15px">복습을 꾸준히 해서 30일 뒤에도 기억하면 금빛 나무가 돼요. 🌰는 아직 만나지 않은 한자예요.</p>

/* ---- 배지 ---- */
V.badges=()=>{const p=cur();
  return `<div class="wrap"><div class="topbar"><button class="back" data-act="toHome">← 홈</button></div><h1 class="h1">🏅 ${esc(p.name)}의 배지</h1>

/* ---- 부모 확인 / 리포트 ---- */

V.report=()=>{const p=cur(),t=today(),start=addDays(weekStart(t),-21);
  const days=Array.from({length:28},(_,i)=>addDays(start,i));
  const lg=d=>p.log[d]||{sec:0,done:0,newH:0,games:0,rev:0};
  const wk=Array.from({length:7},(_,i)=>addDays(t,i-6));
  const wkDays=wk.filter(d=>lg(d).done||lg(d).sec>0).length,wkMin=Math.round(wk.reduce((s,d)=>s+lg(d).sec,0)/60),wkNew=wk.reduce((s,d)=>s+lg(d).newH,0);
  const boxes=[1,2,3,4,5,6].map(b=>Object.values(p.srs).filter(e=>e.b===b).length),bmax=Math.max(1,...boxes);
  const weak=Object.entries(p.wrong).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const inf=p.infer.n?Math.round(p.infer.ok/p.infer.n*100):null;
  const ih=p.inferHist||[],rate=a=>Math.round(a.reduce((s,x)=>s+x[1],0)/a.length*100);
  let infBlock;
  if(ih.length<6)infBlock=`<p class="muted">지금까지 뜻 추리 문제를 ${ih.length}개 풀었어요. 6문제 넘게 쌓이면 처음과 최근을 비교해 보여 드려요.</p>`;
  else{const k=Math.min(10,Math.floor(ih.length/2)),f=rate(ih.slice(0,k)),r=rate(ih.slice(-k)),dd=r-f,ws=weekStart(t);
    const weeks=Array.from({length:8},(_,i)=>{const s=addDays(ws,-7*(7-i)),e=addDays(s,6),it=ih.filter(x=>x[0]>=s&&x[0]<=e);return{label:(+s.slice(5,7))+'/'+(+s.slice(8)),n:it.length,rate:it.length?rate(it):0};});
    infBlock=`<div class="cmp"><div><small>처음 ${k}문제</small><b>${f}%</b></div><span class="arrow ${dd>0?'up':dd<0?'down':''}">${dd>0?'▲':dd<0?'▼':'='} ${Math.abs(dd)}%p</span><div><small>최근 ${k}문제</small><b>${r}%</b></div></div>
    <p class="lesson-h">주별 정답률 (최근 8주)</p>
    <div class="wchart">${weeks.map(w=>`<div class="wcol" title="${w.label} 주 · ${w.n}문제"><span class="wv">${w.n?w.rate+'%':'-'}</span><div class="wbar"><i style="height:${w.rate}%"></i></div><small>${w.label}</small><small class="muted">${w.n}문제</small></div>`).join('')}</div>`;}
  infBlock+=`<p class="muted" style="font-size:13px">처음 보는 낱말의 뜻을 아는 글자로 짐작하는 문제예요. 문제마다 어렵기가 달라서 한 주가 아니라 몇 주의 흐름으로 봐 주세요.</p>`;
  const lvl=d=>{const l=lg(d),m=l.sec/60;if(!l.done&&!l.sec)return '';return m>=10?'l3':m>=5?'l2':'l1';};
  const label=k=>{const it=keyItem(k);return it.t==='h'?`<span class="han">${it.c}</span> ${hs(it.c)}`:`<span class="han">${it.w}</span> ${WM[it.w]?WM[it.w].r:''}`;};
  const praise=wkDays>=5?`"이번 주에 ${wkDays}일이나 공부했구나! 정말 꾸준해."`:nS(p)>=10?`"벌써 한자어를 ${nS(p)}개나 알게 됐네! 어떤 낱말이 제일 재미있었어?"`:nL(p)?`"오늘 배운 한자로 낱말 하나 만들어 볼래?"`:`"오늘 묵룡 알을 같이 깨워 볼까?"`;
  return `<div class="wrap rep"><div class="topbar"><button class="back" data-act="toHome">← 홈</button><span class="chip">📊 부모님 리포트</span></div>
  <h1 class="h1">${esc(p.name)} · ${p.grade}학년</h1>
  <div class="stats">
    <div class="stat"><small>최근 7일 학습일</small><b>${wkDays}/7일</b></div>
    <div class="stat"><small>최근 7일 학습 시간</small><b>${wkMin}분</b></div>
    <div class="stat"><small>연속 / 최고 기록</small><b>${p.streak}일 / ${p.best}일</b></div>
    <div class="stat"><small>배운 한자 (이번 주 +${wkNew})</small><b>${nL(p)}/50자</b></div>
    <div class="stat"><small>만난 한자어</small><b>${nS(p)}개</b></div>
    <div class="stat"><small>뜻 추리 정답률 (전체 ${p.infer.n}문제)</small><b>${inf==null?'-':inf+'%'}</b></div>
  </div>
  <section class="card rep"><h2>뜻 추리 정답률 변화 (어휘·문해력)</h2>${infBlock}</section>
  <section class="card rep"><h2>학습 달력 (4주)</h2>
    <div class="cal">${['월','화','수','목','금','토','일'].map(w=>`<span class="wd">${w}</span>`).join('')}${days.map(d=>`<span class="d ${lvl(d)} ${d>t?'fut':''} ${d===t?'today':''}" title="${d} · ${Math.round(lg(d).sec/60)}분">${+d.slice(8)}</span>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--surface2)"></i>안 함</span><span><i style="background:var(--leaf-soft)"></i>5분 미만</span><span><i style="background:color-mix(in srgb,var(--leaf) 55%,var(--surface))"></i>5~10분</span><span><i style="background:var(--leaf)"></i>10분 이상</span></div>
    <p class="muted" style="font-size:13px">학습 시간은 배우기·게임 화면에서 실제로 화면을 누르며 활동한 시간만 셉니다.</p></section>
  <section class="card rep"><h2>코스 진도</h2>${['k12','g8'].map(k=>{const pr=courseProg(p,k);return `<div><div class="row" style="justify-content:space-between"><span>${COURSES[k].name}</span><span class="muted">${pr.done}/${pr.total} 단원</span></div><div class="pbar"><i style="width:${Math.round(pr.done/pr.total*100)}%"></i></div></div>`;}).join('')}</section>
  <section class="card rep"><h2>기억 상자 (망각곡선 복습)</h2><p class="muted" style="font-size:14px">맞히면 다음 상자로 가서 1일→3일→7일→14일→30일 뒤에 다시 나와요. 마지막 상자까지 통과하면 "내 것이 된 한자·낱말"이에요.</p>
    <div class="hbars">${boxes.map((n,i)=>`<div class="hb"><span>${i<5?(i+1)+'번 상자':'✨ 내 것'}</span><span class="tr"><i class="${i===5?'gold':''}" style="width:${n/bmax*100}%"></i></span><span>${n}</span></div>`).join('')}</div></section>
  <section class="card rep weak"><h2>자주 틀리는 글자 TOP 5</h2>${weak.length?`<ul>${weak.map(([k,n])=>`<li><span>${label(k)}</span><span class="muted">${n}번</span></li>`).join('')}</ul><p class="muted" style="font-size:14px">이 글자들을 함께 소리 내어 읽거나, 생활 속에서 찾아보면 도움이 돼요.</p>`:'<p class="muted">아직 틀린 기록이 없어요.</p>'}</section>
  <section class="praise"><b class="disp">오늘 건네 볼 한마디</b><p>${praise}</p></section>
  <section class="card rep"><h2>기록 백업</h2>
    <p class="muted" style="font-size:14px">모든 프로필의 학습 기록을 파일 하나로 저장해요. 브라우저 기록을 지웠거나 다른 기기·다른 주소로 옮길 때 이 파일로 되살릴 수 있어요.</p>
    <div class="row"><button class="btn ghost sm" data-act="backup">💾 기록 파일로 저장</button><button class="btn ghost sm" data-act="restorePick">📂 기록 파일 불러오기</button></div>
    <input type="file" id="restore-in" accept=".json,application/json" hidden>
    ${restoreBox()}
  </section>
  </div>`;};

/* ================= 동작 ================= */

/* 모험 흐름 */
A.startAdv=()=>{const p=cur(),rev=dueKeys(p).slice(0,8),nn=nextNew(p,3);
  S.adv={phase:rev.length?'review':(nn.cs.length?'learn':'game'),rev,ri:0,newC:nn.cs,title:nn.title,hi:0,page:0,sq:[],si:0,learned:[],xp:0,revOk:0,gamePlayed:false,startStage:stageOf(p.xp),endStage:stageOf(p.xp),applied:false};
  S.more=false;S.turn=0;S.wst={};
  if(S.adv.phase==='review')setQ(reviewQ(rev[0]),ctxRev());
  go('adv');
  if(S.adv.phase==='learn')setTimeout(()=>speak(hs(S.adv.newC[0])),1500);};
function reviewQ(k){const it=keyItem(k);const ks=it.t==='h'?['h2m','m2h']:['w2m','m2w','sent'];if(CAN_SAY)ks.push('listen');return makeQ(it,pick(ks));}
function ctxRev(){return{onAnswer(ok){const p=cur(),ad=S.adv,k=ad.rev[ad.ri];srsAnswer(p,k,ok);L(p).rev++;if(ok){ad.revOk++;p.revOk=(p.revOk||0)+1;p.xp+=2;ad.xp+=2;}save();},
  onNext(){const ad=S.adv;ad.ri++;S.turn++;if(ad.ri<ad.rev.length)setQ(reviewQ(ad.rev[ad.ri]),ctxRev());else{ad.phase=ad.newC.length?'learn':'game';if(ad.phase==='learn')setTimeout(()=>speak(hs(ad.newC[0])),1500);}render();window.scrollTo(0,0);}};}
function commitLearn(){const p=cur(),ad=S.adv,h=HM[ad.newC[ad.hi]],shown=h.words.slice(0,S.more?99:nWords(p));
  if(!p.learned[h.c]){p.learned[h.c]=today();srsAdd(p,'h:'+h.c);p.xp+=10;ad.xp+=10;L(p).newH++;ad.learned.push(h.c);}
  shown.forEach(o=>{if(!p.seen[o.w]){p.seen[o.w]=today();srsAdd(p,'w:'+o.w);}});save();}
function sentQs(){const p=cur(),h=HM[S.adv.newC[S.adv.hi]],shown=h.words.slice(0,S.more?99:nWords(p)).filter(o=>o.s);return shuffle(shown).slice(0,2).map(o=>makeQ({t:'w',w:o.w},'sent'));}
function ctxSent(){return{onAnswer(ok){if(ok){cur().xp+=1;S.adv.xp+=1;}else S.adv.sentMiss=true;save();},onNext(){const ad=S.adv;ad.si++;if(ad.si<ad.sq.length){setQ(ad.sq[ad.si],ctxSent());render();}else nextHanzi();}};}
function nextHanzi(){const ad=S.adv;ad.hi++;ad.page=0;S.more=false;S.wst={};if(ad.hi>=ad.newC.length)ad.phase='game';render();window.scrollTo(0,0);if(ad.phase==='learn')setTimeout(()=>speak(hs(ad.newC[ad.hi])),1500);}
A.lnext=()=>{const ad=S.adv;
  if(ad.page===2){commitLearn();ad.sq=sentQs();ad.si=0;if(!ad.sq.length){nextHanzi();return;}ad.page=3;setQ(ad.sq[0],ctxSent());render();window.scrollTo(0,0);return;}
  ad.page++;if(ad.page===1)S.after=setupCanvas;render();window.scrollTo(0,0);};
A.more=()=>{S.more=true;render();};
/* 기록 백업·되살리기 (부모님 리포트) */
A.backup=async()=>{const data=JSON.stringify({app:'mukryong-hanja',v:1,savedAt:new Date().toLocaleString('ko-KR'),db:DB}),filename='묵룡한자숲_기록_'+today()+'.json';
  // claude.ai 안에서는 downloads 기능으로, 따로 올린 앱에서는 브라우저 다운로드로 저장
  const dl=window.claude&&typeof window.claude.use==='function'?await window.claude.use('downloads').catch(()=>null):null;
  if(dl){try{await dl.save({filename,data});toast('💾 기록 파일을 저장했어요');}catch(e){if(e&&e.code!=='declined')toast('이 화면에서는 저장할 수 없어요');}return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('💾 기록 파일을 저장했어요');}
  catch(e){toast('이 화면에서는 저장할 수 없어요');}};
A.restorePick=()=>{const el=document.getElementById('restore-in');if(!el)return;el.value='';
  el.onchange=()=>{const f=el.files&&el.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);
    if(!d||d.app!=='mukryong-hanja'||!d.db||!Array.isArray(d.db.profiles)||!d.db.profiles.length)throw 0;
    S.restore=d;render();}).catch(()=>toast('묵룡 한자 숲 기록 파일이 아니에요'));};el.click();};
A.restoreNo=()=>{S.restore=null;render();};
function restoreBox(){return S.restore?`<div class="confirm"><span>파일(${esc(S.restore.savedAt||'')})에 있는 프로필 <b>${S.restore.db.profiles.map(x=>esc(x.name)).join(', ')}</b>의 기록으로 바꿔요. 같은 프로필의 지금 기록은 파일 내용으로 덮어써요.</span><div class="prow"><button class="btn sm" data-act="restoreYes">되살리기</button><button class="btn ghost sm" data-act="restoreNo">그만두기</button></div></div>`:'';}

  d.db.profiles.forEach(np=>{const i=DB.profiles.findIndex(p=>p.id===np.id);if(i>=0)DB.profiles[i]=np;else if(DB.profiles.length<6)DB.profiles.push(np);});
  if(!cur())DB.current=d.db.profiles[0].id;save();try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}syncUp();
  toast('✅ 기록을 되살렸어요');go('profiles',{manage:false});};
A.wtap=d=>{const w=d.w,o=WM[w];if(!o)return;if(!S.wst)S.wst={};const st=S.wst[w]||0;speak(o.r);if(st<2){S.wst[w]=st+1;const y=window.scrollY;render();window.scrollTo(0,y);}};
A.replayStroke=()=>{const el=document.getElementById('sorder');if(el)el.innerHTML=strokeSVG(S.adv.newC[S.adv.hi],true);};

  if(TR.c){traceMsg('처음부터 다시 써요. 노란 1번 동그라미에서 시작해요.');const b=document.getElementById('writeDone');if(b){b.disabled=true;b.textContent='✏️ 끝까지 쓰면 넘어갈 수 있어요';}}};
A.qans=d=>{if(S.qa!=null)return;const i=+d.i,ok=S.q.opts[i].ok;S.qa=i;if(S.q.afterSay)speak(S.q.afterSay);else if(S.q.say&&!ok)speak(S.q.say);S.qctx.onAnswer(ok);render();};

A.startGame=d=>startGame(d.id,!!d.adv||!!(S.g&&S.g.fromAdv&&S.screen==='game'));

// 뜻 추리 후보: 아직 안 본 낱말 중 ① 모든 글자를 배운 것 ② 배운 글자가 하나라도 든 것 ③ 나머지 순서 (모르는 글자는 뜻·음 힌트로 보여 줌)
function inferCands(p,n){const kn=c=>!!p.learned[c];const pool=[...INFW,...WORDS].filter(o=>!p.inferDone[o.w]&&!p.seen[o.w]);
  const pure=shuffle(pool.filter(o=>[...o.w].every(kn))),part=shuffle(pool.filter(o=>[...o.w].some(kn)&&![...o.w].every(kn))),rest=shuffle(pool.filter(o=>![...o.w].some(kn)));
  return [...pure,...part,...rest].slice(0,n);}
function makeInferQ(o){const opts=shuffle([o,...sample([...WORDS,...INFW].filter(x=>x.w!==o.w&&x.m!==o.m),3)]);
  return{key:'w:'+o.w,inferW:o,prompt:`<div class="qbig han ${lenCls(o.w)}">${o.w}</div><div class="hint">${[...o.w].map(c=>`<span><b class="han">${c}</b> = ${hs(c)}</span>`).join('<span>+</span>')}</div><div class="qsub">이 낱말의 뜻은 무엇일까요?</div>`,
    opts:opts.map(x=>({html:`<span>${x.m}</span>`,ok:x===o})),answerText:o.m,explain:brk(o.w)+' → '+o.r+': '+o.m,afterSay:o.r};}
// 날짜별 기록: 하루 합계(log.iN/iOk)와 문제별 기록(inferHist: [날짜, 정답 1/0])
function recordInfer(p,o,ok){p.infer.n++;if(ok)p.infer.ok++;const l=L(p);l.iN=(l.iN||0)+1;if(ok)l.iOk=(l.iOk||0)+1;
  if(!p.inferHist)p.inferHist=[];p.inferHist.push([today(),ok?1:0]);if(p.inferHist.length>1000)p.inferHist.splice(0,p.inferHist.length-1000);
  p.inferDone[o.w]=1;if(!o.inf&&!p.seen[o.w]){p.seen[o.w]=today();srsAdd(p,'w:'+o.w);}save();}
A.afterGame=()=>{const p=cur(),ad=S.adv;ad.infQ=inferCands(p,p.grade<=2?2:3);ad.ii=0;
  if(ad.infQ.length){ad.phase='infer';setQ(makeInferQ(ad.infQ[0]),ctxInfer());}
  else finishAdv();
  go('adv');};
function ctxInfer(){return{onAnswer(ok){const p=cur(),ad=S.adv;if(ok){p.xp+=3;ad.xp+=3;}recordInfer(p,S.q.inferW,ok);},
  onNext(){const ad=S.adv;ad.ii++;S.turn++;if(ad.ii<ad.infQ.length)setQ(makeInferQ(ad.infQ[ad.ii]),ctxInfer());else finishAdv();render();window.scrollTo(0,0);}};}
function ctxInferGame(){return{onAnswer(ok){if(ok)S.g.correct++;recordInfer(cur(),S.q.inferW,ok);},
  onNext(){const g=S.g;g.qi++;S.turn++;if(g.qi<g.qs.length){setQ(g.qs[g.qi],ctxInferGame());render();}else endGame();}};}
function finishAdv(){const p=cur(),ad=S.adv;
  if(!ad.applied){ad.applied=true;const t=today();
    if(p.lastDone!==t){p.streak=p.lastDone===addDays(t,-1)?p.streak+1:1;p.lastDone=t;p.best=Math.max(p.best||0,p.streak);}
    p.adv=(p.adv||0)+1;L(p).done++;p.xp+=10;ad.xp+=10;if(p.together)p.togetherDone=(p.togetherDone||0)+1;
    ad.newBadges=checkBadges(p,true);ad.endStage=stageOf(p.xp);save();
    setTimeout(()=>speak(ad.endStage>ad.startStage?'와! 묵룡이 자랐어요!':'오늘의 모험 완료! 정말 잘했어요!'),300);}
  ad.phase='finish';}

/* 짝꿍 카드 */
A.mflip=(d,el)=>{const g=S.g,i=+d.i,c=g.cards[i];if(g.lock||c.up||c.done)return;c.up=true;el.classList.add('up');speak(c.say);g.open.push(i);
  if(g.open.length===2){g.moves++;const m=document.getElementById('mmoves');if(m)m.textContent=g.moves;const [a,b]=g.open.map(j=>g.cards[j]);
    if(a.pair===b.pair){a.done=b.done=true;g.open.forEach(j=>{const e=document.querySelector(`.mcard[data-i="${j}"]`);if(e)e.classList.add('done');});g.open=[];g.matched++;g.correct++;g.total=g.pairs;S.turn++;
      if(g.matched===g.pairs)setTimeout(endGame,700);}
    else{g.lock=true;setTimeout(()=>{g.open.forEach(j=>{g.cards[j].up=false;const e=document.querySelector(`.mcard[data-i="${j}"]`);if(e)e.classList.remove('up');});g.open=[];g.lock=false;S.turn++;const t=document.querySelector('.turn');if(t){const p=cur();t.textContent=S.turn%2?'🧑 어른 차례':'🧒 '+p.name+' 차례';}},950);}}};
/* 빙고 */
A.bsay=()=>bingoSay();
A.bshow=()=>{S.g.showText=true;render();};
A.bpick=d=>{const g=S.g,i=+d.i;if(g.st[i]||g.done)return;const target=g.order[g.ci];
  if(i===target){g.st[i]=true;g.correct++;g.ci++;speak(itemSay(g.cells[i]));const ln=bingoLines(g.st);if(ln>g.lines){g.lines=ln;toast('🎉 빙고 '+ln+'줄!');}
    g.showText=!CAN_SAY;S.turn++;if(g.ci>=g.cells.length){render();setTimeout(endGame,600);return;}render();setTimeout(bingoSay,1100);}
  else{g.shake=i;g.showText=true;if(!g.missed)g.missed={};if(!g.missed[target]){g.missed[target]=1;g.correct=Math.max(0,g.correct-0);srsAnswer(cur(),itemKey(g.cells[target]),false);g.wrongCount=(g.wrongCount||0)+1;}save();render();g.shake=null;}};
/* 글자 조립소 */
A.apick=d=>{const g=S.g,k=+d.k,o=g.rounds[g.ri],chars=[...o.w],t=g.tray[k];if(t.used||g.rdone)return;
  if(t.c===chars[g.slots.length]){t.used=true;g.slots.push(t.c);if(g.slots.length===chars.length){g.rdone=true;if(!g.wrongThis)g.correct++;speak(o.r);}}
  else{g.shake=k;t.tried=true;if(!g.wrongThis){g.wrongThis=true;srsAnswer(cur(),'w:'+o.w,false);save();}}
  render();g.shake=null;};
A.anext=()=>{const g=S.g;g.ri++;S.turn++;if(g.ri>=g.rounds.length){endGame();return;}asmRound();render();};
/* 주사위 숲길 */
A.roll=()=>{const g=S.g;if(g.rolling||g.q)return;g.rolling=true;g.msg='데구르르…';render();
  setTimeout(()=>{const n=1+Math.floor(Math.random()*6);g.die=n;g.rolling=false;g.pos=Math.min(g.pos+n,g.len-1);
    if(g.pos===g.len-1){g.msg='🪺 묵룡 둥지에 도착했어요!';render();setTimeout(endGame,900);return;}
    const star=g.pos%5===4;g.star=star;g.msg=`${n}칸 앞으로!${star?' ⭐ 칸이에요!':''} 문제를 풀어요.`;
    const it=g.items[g.qi%g.items.length];g.qi++;g.q=true;setQ(makeQ(it,randKind(it)),ctxBoard());render();},650);};
function ctxBoard(){return{onAnswer(ok){const g=S.g;g.total++;g.lastOk=ok;if(ok)g.correct++;else srsAnswer(cur(),S.q.key,false);save();},
  onNext(){const g=S.g,move=(g.lastOk?1:0)+(g.star?1:0);g.q=false;S.turn++;g.pos=Math.min(g.pos+move,g.len-1);
    g.msg=move?`${g.lastOk?'정답 보너스':''}${g.lastOk&&g.star?' + ':''}${g.star?'⭐ 보너스':''}로 ${move}칸 더!`:'다시 주사위를 굴려요!';
    if(g.pos===g.len-1){g.msg='🪺 묵룡 둥지에 도착했어요!';render();setTimeout(endGame,900);return;}render();}};}

/* 따라 쓰기 캔버스 */
// 획순 자료가 있는 글자는 한 획을 쓸 때마다 몇 번 획과 가장 닮았는지 보고, 차례가 아니면 빨간 글씨로 알려 줌
const TR={c:null,done:0,paths:[],bad:null,badT:null};
function setupCanvas(){const cv=document.getElementById('cv');if(!cv)return;const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  x.lineCap='round';x.lineJoin='round';x.lineWidth=Math.max(10,r.width/20);x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--leaf').trim()||'#3B9459';x.fillStyle=x.strokeStyle;
  const c=S.adv&&S.adv.newC[S.adv.hi];clearTimeout(TR.badT);Object.assign(TR,{c:STK[c]?c:null,done:0,miss:0,paths:[],bad:null,badT:null});traceMark();
  let on=false,last=null,pts=[];const pos=e=>{const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};};
  cv.addEventListener('pointerdown',e=>{if(TR.bad){clearTimeout(TR.badT);TR.bad=null;traceDraw();}on=true;last=pos(e);pts=[last];try{cv.setPointerCapture(e.pointerId);}catch(_){}x.beginPath();x.arc(last.x,last.y,x.lineWidth/2,0,Math.PI*2);x.fill();e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!on)return;const p=pos(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;pts.push(p);e.preventDefault();});
  const stop=()=>{if(!on)return;on=false;traceCheck(pts);};cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);}
// 선을 같은 간격의 점 n개로 고름
function resample(pts,n){const d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=d[d.length-1];if(!L)return Array(n).fill(pts[0]);const out=[];let j=0;
  for(let k=0;k<n;k++){const t=L*k/(n-1);while(j<d.length-2&&d[j+1]<t)j++;const s=d[j+1]-d[j]||1,u=Math.min(1,(t-d[j])/s);out.push([pts[j][0]+(pts[j+1][0]-pts[j][0])*u,pts[j][1]+(pts[j+1][1]-pts[j][1])*u]);}
  return out;}
const avgDist=(a,b)=>a.reduce((s,p,i)=>s+Math.hypot(p[0]-b[i][0],p[1]-b[i][1]),0)/a.length;
function medianOf(c,i){const m=STK[c].m[i],o=[];for(let k=0;k<m.length;k+=2)o.push([m[k],900-m[k+1]]);return o;}
function traceCheck(raw){if(!TR.c)return;const d=STK[TR.c],n=d.s.length;if(TR.done>=n)return;
  const cv=document.getElementById('cv'),W=cv.clientWidth,H=cv.clientHeight;
  // 화면 좌표 → 획순 그림 좌표 (.stroke가 칸 안쪽 6%에 88% 크기로 놓임)
  const u=raw.map(p=>[(p.x/W-.06)/.88*1024,(p.y/H-.06)/.88*1024]);
  const len=u.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-u[i][0],p[1]-u[i][1]),0);
  if(len<12&&n>0&&raw.length<3){traceDraw();return;} // 살짝 닿은 것은 획으로 치지 않음
  const us=resample(u,16),usR=us.slice().reverse(),LIM=210;
  // 길이가 너무 다르면(마구 그은 선 등) 그 획으로 보지 않음
  const mlen=m=>m.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-m[i][0],p[1]-m[i][1]),0),fits=i=>{const m=mlen(medianOf(TR.c,i));return len>m*.35-60&&len<m*2.5+250;}; // 짧은 획은 손떨림을 넉넉히 봐줌
  let best=-1,bd=1e9;for(let i=TR.done;i<n;i++){if(!fits(i))continue;const dd=avgDist(us,resample(medianOf(TR.c,i),16));if(dd<bd){bd=dd;best=i;}}
  const exp=resample(medianOf(TR.c,TR.done),16),de=fits(TR.done)?avgDist(us,exp):1e9,dr=fits(TR.done)?avgDist(usR,exp):1e9,next=TR.done+1;
  // 지금 차례인 획을 우선으로 봄: 다른 획이 확실히 더 가까울 때만(거리 절반 남짓) 순서 틀림으로 판단
  const clearlyOther=best!==TR.done&&bd<150&&bd<de*.55;
  if(de<LIM&&!clearlyOther){traceAccept(raw);return;}
  // 같은 획을 세 번 틀리면 막히지 않도록 묵룡이 그 획을 대신 그어 줌
  if(++TR.miss>=3){const help=medianOf(TR.c,TR.done).map(([a,b])=>({x:(a/1024*.88+.06)*W,y:(b/1024*.88+.06)*H}));
    traceAccept(help,`괜찮아요! 묵룡이 ${next}번 획을 같이 써 줬어요.`);return;}
  let msg;
  if(dr<LIM&&dr<de*.7&&!clearlyOther)msg=`앗, 획을 거꾸로 썼어요! ${next}번 획은 노란 ${next}번 동그라미가 있는 쪽에서 시작해요.`;
  else if(clearlyOther)msg=`앗, 순서가 달라요! 방금 쓴 건 ${best+1}번 획이에요. 지금은 ${next}번 획을 쓸 차례예요.`;
  else msg=`앗, ${next}번 획과 모양이 달라요. 노란 ${next}번 동그라미에서 시작해서 다시 써 봐요.`;
  TR.bad=raw;traceDraw();traceMark(true);traceMsg(msg,'bad');
  TR.badT=setTimeout(()=>{TR.bad=null;traceDraw();},1400);}
function traceAccept(path,pre){const n=STK[TR.c].s.length;TR.paths.push(path);TR.done++;TR.miss=0;TR.bad=null;traceDraw();traceMark();
  const all=TR.done>=n;traceMsg(all?`🎉 ${n}획을 모두 차례대로 썼어요! 참 잘했어요.`:`${pre?pre+' ':'좋아요! '}이제 ${TR.done+1}번 획을 써요.`,'ok');
  const b=document.getElementById('writeDone');if(b){b.disabled=!all;b.textContent=all?'다 썼어요 ✓':'✏️ 끝까지 쓰면 넘어갈 수 있어요';}
  if(all)speak('참 잘했어요!');}
// 맞게 쓴 획은 초록, 방금 틀린 획은 빨강으로 다시 그림
function traceDraw(){const cv=document.getElementById('cv');if(!cv)return;const x=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,cv.width,cv.height);x.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement),line=(p,col)=>{x.strokeStyle=x.fillStyle=col;x.beginPath();x.arc(p[0].x,p[0].y,x.lineWidth/2,0,Math.PI*2);x.fill();x.beginPath();x.moveTo(p[0].x,p[0].y);p.forEach(q=>x.lineTo(q.x,q.y));x.stroke();};
  TR.paths.forEach(p=>line(p,cs.getPropertyValue('--leaf').trim()||'#3B9459'));if(TR.bad)line(TR.bad,cs.getPropertyValue('--coral').trim()||'#E65F4F');
  x.strokeStyle=x.fillStyle=cs.getPropertyValue('--leaf').trim()||'#3B9459';}
// 따라 쓰기 칸의 번호: 쓴 획은 흐리게, 다음 획은 크게 깜빡이게 (틀렸을 때는 한 번 더 크게)
// 번호는 두 겹: 아래 겹(기다리는 번호)과 쓴 선 위에 뜨는 위 겹(지금 쓸 번호)
function traceMark(shake){document.querySelectorAll('.trace .ghost.svg').forEach(layer=>layer.querySelectorAll('.sn').forEach((g,i)=>{g.classList.toggle('done',i<TR.done);g.classList.toggle('next',i===TR.done);
  g.classList.remove('nudge');if(shake&&i===TR.done){void g.getBBox();g.classList.add('nudge');}}));}
function traceMsg(t,kind){const el=document.getElementById('tmsg');if(!el)return;el.textContent=t;el.className='tmsg '+(kind||'');
  if(kind==='bad'){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}}

/* 이벤트 연결 */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;
  if(t.classList.contains('ov')&&e.target!==t)return; // 시트 안쪽 클릭은 닫지 않음
  if(t.disabled)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t,e);}});
document.addEventListener('input',e=>{
  if(e.target.id==='f-name'&&S.form){S.form.name=e.target.value.slice(0,8);const b=document.getElementById('fsave');if(b)b.disabled=!S.form.name.trim();}
  if(e.target.id==='gate-in'&&S.gate)S.gate.input=e.target.value;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='gate-in')A.gateGo();if(e.target.id==='f-name')A.fsave();}});

/* 학습 시간 기록: 배우기·게임 화면에서 최근 1분 안에 활동했을 때만 */
let lastAct=Date.now();['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
setInterval(()=>{const p=cur();if(!p||document.hidden||!['adv','game'].includes(S.screen)||Date.now()-lastAct>60000)return;L(p).sec+=15;save();},15000);

/* 시작 */
load();
if(DB.profiles.length===1){DB.current=DB.profiles[0].id;checkDaily(cur());S.screen='home';}
render();
initCloud();
</script>
